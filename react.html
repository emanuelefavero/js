<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <title>React 19</title>

    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19",
          "react-dom/client": "https://esm.sh/react-dom@19/client?external=react",
          "react/jsx-runtime": "https://esm.sh/react@19/jsx-runtime?external=react",
          "react/jsx-dev-runtime": "https://esm.sh/react@19/jsx-dev-runtime?external=react"
        }
      }
    </script>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- CSS -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: system-ui, sans-serif;
        padding: 1rem;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- React App -->
    <script type="text/babel" data-type="module" data-presets="react">
      import React, { useState } from 'react';
      import { createRoot } from 'react-dom/client';

      const App = () => {
        const [count, setCount] = useState(0);

        const increment = () => setCount((prev) => prev + 1);

        return (
          <>
            <h1>Hello</h1>

            <button onClick={increment}>Count: {count}</button>
          </>
        );
      };

      createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
